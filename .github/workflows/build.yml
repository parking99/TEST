name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build Xcode Archive (No Signing)
      run: |
        xcodebuild archive \
          -project IOSLocationTracker/IOSLocationTracker.xcodeproj \
          -scheme IOSLocationTracker \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $RUNNER_TEMP/IOSLocationTracker.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package App into IPA
      run: |
        mkdir -p Payload
        cp -r $RUNNER_TEMP/IOSLocationTracker.xcarchive/Products/Applications/IOSLocationTracker.app Payload/
        zip -r IOSLocationTracker.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IOSLocationTracker-IPA
        path: IOSLocationTracker.ipa
